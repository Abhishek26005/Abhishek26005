<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="hero-title hero-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hero-title">Full-stack architecture diagram</title>
  <desc id="hero-desc">React and React Native clients connect to Spring Boot and Node.js services, which connect to MySQL, MongoDB and Firebase.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="glow-blue" gradientUnits="userSpaceOnUse" cx="180" cy="30" r="380">
      <stop offset="0" stop-color="#2F81F7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" gradientUnits="userSpaceOnUse" cx="1040" cy="270" r="400">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="870" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1B2742"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="280" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .mono  { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    .node  { fill: #101A2F; stroke: #24324D; stroke-width: 1.2; }
    .name  { font-size: 18px; fill: #E6EDF3; }
    .layer { font-size: 13px; fill: #7D8CA3; letter-spacing: 0.06em; }
    .pulse { stroke-dasharray: 0.1 14; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14.1; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#dots)"/>
    <rect width="1200" height="280" fill="url(#glow-blue)"/>
    <rect width="1200" height="280" fill="url(#glow-violet)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="17.5" fill="none" stroke="#1B2742" stroke-width="1.5"/>

  <!-- layer labels -->
  <text class="mono layer" x="130" y="46">clients</text>
  <text class="mono layer" x="500" y="46">services</text>
  <text class="mono layer" x="870" y="46">data</text>

  <!-- wires: faint base line, then moving dots on top -->
  <g fill="none" stroke="url(#flow)" stroke-width="1.5" opacity="0.28">
    <path d="M330 122 H500"/>
    <path d="M330 122 C415 122 415 198 500 198"/>
    <path d="M330 198 H500"/>
    <path d="M700 122 C785 122 785 96 870 96"/>
    <path d="M700 198 C785 198 785 160 870 160"/>
    <path d="M700 198 C785 198 785 224 870 224"/>
  </g>
  <g class="pulse" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round">
    <path d="M330 122 H500"/>
    <path d="M330 122 C415 122 415 198 500 198"/>
    <path d="M330 198 H500"/>
    <path d="M700 122 C785 122 785 96 870 96"/>
    <path d="M700 198 C785 198 785 160 870 160"/>
    <path d="M700 198 C785 198 785 224 870 224"/>
  </g>

  <!-- clients -->
  <g transform="translate(130 99)">
    <rect class="node" width="200" height="46" rx="12"/>
    <circle cx="22" cy="23" r="4.5" fill="#2F81F7"/>
    <text class="mono name" x="40" y="29">React</text>
  </g>
  <g transform="translate(130 175)">
    <rect class="node" width="200" height="46" rx="12"/>
    <circle cx="22" cy="23" r="4.5" fill="#2F81F7"/>
    <text class="mono name" x="40" y="29">React Native</text>
  </g>

  <!-- services -->
  <g transform="translate(500 99)">
    <rect class="node" width="200" height="46" rx="12"/>
    <circle cx="22" cy="23" r="4.5" fill="#8B5CF6"/>
    <text class="mono name" x="40" y="29">Spring Boot</text>
  </g>
  <g transform="translate(500 175)">
    <rect class="node" width="200" height="46" rx="12"/>
    <circle cx="22" cy="23" r="4.5" fill="#8B5CF6"/>
    <text class="mono name" x="40" y="29">Node.js</text>
  </g>

  <!-- data -->
  <g transform="translate(870 73)">
    <rect class="node" width="200" height="46" rx="12"/>
    <circle cx="22" cy="23" r="4.5" fill="#22D3EE"/>
    <text class="mono name" x="40" y="29">MySQL</text>
  </g>
  <g transform="translate(870 137)">
    <rect class="node" width="200" height="46" rx="12"/>
    <circle cx="22" cy="23" r="4.5" fill="#22D3EE"/>
    <text class="mono name" x="40" y="29">MongoDB</text>
  </g>
  <g transform="translate(870 201)">
    <rect class="node" width="200" height="46" rx="12"/>
    <circle cx="22" cy="23" r="4.5" fill="#22D3EE"/>
    <text class="mono name" x="40" y="29">Firebase</text>
  </g>
</svg>
